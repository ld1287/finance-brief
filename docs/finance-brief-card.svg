      <text x="28" y="19" class="ff-en" fill="#67E8F9" font-size="12" font-weight="600" letter-spacing="1">OCTOSENSE APP</text>
    </g>
    <text x="0" y="100" class="ff-sc" fill="#F1F5F9" font-size="68" font-weight="700" letter-spacing="3">财经简报</text>
    <text x="0" y="142" class="ff-mono" fill="#22D3EE" font-size="22" font-weight="500" letter-spacing="2">finance-brief</text>
    <text x="0" y="178" class="ff-sc" fill="#CBD5E1" font-size="17" font-weight="400">单一 Octoscript 路径 · 12 界面 · 5 数据源 · native widgets via makepad</text>
  </g>
  <!-- chart -->
  <g transform="translate(700, 56)">
    <rect x="0" y="0" width="520" height="188" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.22"/>
    <rect x="0" y="0" width="520" height="22" rx="10" fill="#22D3EE" fill-opacity="0.06"/>
