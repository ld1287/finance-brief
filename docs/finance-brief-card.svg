      <rect x="0" y="0" width="122" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="0" y="0" width="3" height="60" rx="1.5" fill="#F59E0B"/>
      <text x="14" y="30" class="ff-en" fill="#F59E0B" font-size="22" font-weight="700">✓</text>
      <text x="14" y="48" class="ff-sc" fill="#94A3B8" font-size="11" font-weight="500">native widgets</text>
