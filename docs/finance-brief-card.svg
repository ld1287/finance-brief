  <!-- footer -->
  <text x="60" y="378" class="ff-en" fill="#475569" font-size="11" letter-spacing="0.5">Native widgets via Octoscript DSL → makepad · Apache-2.0</text>
  <text x="1220" y="378" text-anchor="end" class="ff-mono" fill="#475569" font-size="11" letter-spacing="1">// OctoSense</text>
