      <circle cx="14" cy="17" r="4" fill="#22D3EE"/>
      <text x="26" y="16" class="ff-sc" fill="#E2E8F0" font-size="12" font-weight="500">Stooq</text>
      <text x="26" y="28" class="ff-en" fill="#64748B" font-size="9" letter-spacing="0.5">Stooq</text>
    </g>
    <g transform="translate(390, 14)">
      <rect x="0" y="0" width="122" height="34" rx="7" fill="url(#pillHi)" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <circle cx="14" cy="17" r="4" fill="#A855F7"/>
      <text x="26" y="16" class="ff-sc" fill="#E2E8F0" font-size="12" font-weight="500">Hyperliquid</text>
