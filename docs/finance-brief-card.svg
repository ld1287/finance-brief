      <rect x="0" y="0" width="3" height="60" rx="1.5" fill="#10B981"/>
      <text x="14" y="30" class="ff-en" fill="#10B981" font-size="22" font-weight="700">5</text>
      <text x="14" y="48" class="ff-sc" fill="#94A3B8" font-size="11" font-weight="500">数据源</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="122" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="0" y="0" width="3" height="60" rx="1.5" fill="#A855F7"/>
      <text x="14" y="30" class="ff-en" fill="#A855F7" font-size="22" font-weight="700">1</text>
      <text x="14" y="48" class="ff-sc" fill="#94A3B8" font-size="11" font-weight="500">Octoscript 路径</text>
