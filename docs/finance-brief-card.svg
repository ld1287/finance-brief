    <path d="M 30 130 L 80 110 L 130 125 L 180 95 L 230 105 L 280 75 L 330 85 L 380 50 L 430 60 L 480 30 L 500 25 L 500 165 L 30 165 Z" fill="url(#chartFill)"/>
