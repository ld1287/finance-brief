[package]
name = "finance-brief-scaffold"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Finance brief data layer (fetch/parse/cache/state) — Rust backend for the Splash UI"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"