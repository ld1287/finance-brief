# finance-brief capability catalog
# Per .todo-octoscript-rewrite-2026-10-02.md §5.1 (Q-B + Q-R1: B)
#
# 总 17 capability 名（v1 14 + Q-B 新增 3：stream.subscribe / stream.unsubscribe / stream.frequency.set）
# 共 15 个 [[capability]] segment：
#   - fav:    fav.list + fav.toggle        → 1 个 segment（name = 数组）
#   - settings: settings.load + settings.save → 1 个 segment（name = 数组）
# 美股实时源：Stooq CSV（per Q-R1: B 决议，从前一版本迁移而来）

# ---------- 1. news.refresh ----------
[[capability]]
name = "news.refresh"
kind = "fetch"
adapter = "news_sina"
input_schema = "news.refresh.input.schema.json"
output_schema = "news.schema.json"
audit = true
cache_ttl_seconds = 300

[capability.requires]
host_fetch = true


# ---------- 2. news.read ----------
[[capability]]
name = "news.read"
kind = "fetch"
adapter = "news_sina"
input_schema = "news.read.input.schema.json"
output_schema = "news.schema.json"
audit = true
cache_ttl_seconds = 600

[capability.requires]
host_fetch = true


# ---------- 3. quote.snapshot (a/us/hk via tencent; us real-time via stooq, per Q-R1: B) ----------
[[capability]]
name = "quote.snapshot"
kind = "fetch"
adapter = ["quote_tencent", "quote_stooq"]
input_schema = "quote.snapshot.input.schema.json"
output_schema = "quote.schema.json"
audit = true
cache_ttl_seconds = 15

[capability.requires]
host_fetch = true


